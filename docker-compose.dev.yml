version: '3.8'
services:
  report-service:
    build: ./ReportesYVitacora
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - PORT=3006
      - DATABASE_SERVICE_URL=http://database-service:3006
    ports:
      - "${REPORTS_AND_BINNACLES_PORT}:3006"
    depends_on:
      - db
      - database-service
    networks:
      - dev-network

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${REPORTS_MYSQL_PORT}:3306"
    volumes:
      - reports_db_data:/var/lib/mysql
    networks:
      - dev-network

  database-service:
    build:
      context: ./Database
      dockerfile: dockerfile
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - PORT=3006
    depends_on:
      - db
    networks:
      - dev-network
    ports:
      - "${REPORTS_DATABASE_PORT}:3006"

volumes:
  reports_db_data:

networks:
  dev-network:
    driver: bridge
